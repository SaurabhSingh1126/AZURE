<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure Hospitality</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --ink:#12203A;
  --ink-soft:#3A4A63;
  --azure:#1F5FA8;
  --azure-deep:#153F70;
  --azure-tint:#E7EFF8;
  --teal:#0E7C7B;
  --teal-tint:#E4F2F1;
  --stone:#EFEDE3;
  --paper:#FAF9F5;
  --line:#DEDBCE;
  --line-soft:#E9E7DC;
  --amber:#C97A2B;
  --amber-tint:#F8ECDC;
  --green:#2F8F5B;
  --green-tint:#E7F3EC;
  --red:#C0392B;
  --red-tint:#FBEAE7;
  --white:#FFFFFF;
  --shadow: 0 1px 2px rgba(18,32,58,0.06);
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--stone);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}
a{color:var(--azure);}
::selection{background:var(--azure-tint);}

/* ===== Layout ===== */
#app-shell{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:222px;flex-shrink:0;background:var(--ink);color:#C9D3E3;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sb-brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sb-brand .mark{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:#fff;letter-spacing:0.2px;}
.sb-brand .sub{font-size:10.5px;color:#8494AF;margin-top:3px;letter-spacing:.3px;}
.sb-nav{padding:10px 10px;flex:1;}
.sb-group-label{font-size:10px;color:#66799B;padding:14px 10px 5px;letter-spacing:.4px;}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);
  color:#B7C2D6;font-size:13px;cursor:pointer;margin-bottom:1px;border-left:2px solid transparent;
}
.sb-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
.sb-item.active{background:rgba(31,95,168,0.35);color:#fff;border-left:2px solid var(--azure);font-weight:500;}
.sb-item .ic{width:15px;text-align:center;font-size:13px;opacity:.9;}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:#66799B;}

/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  height:56px;flex-shrink:0;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:20;
}
.prop-switcher{position:relative;}
.prop-btn{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  padding:7px 12px;border-radius:var(--radius);font-size:13px;font-weight:500;color:var(--ink);
}
.prop-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--azure);}
.prop-menu{
  position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 6px 18px rgba(18,32,58,0.12);min-width:220px;z-index:50;display:none;
}
.prop-menu.open{display:block;}
.prop-menu-item{padding:9px 14px;font-size:13px;display:flex;align-items:center;gap:8px;}
.prop-menu-item:hover{background:var(--azure-tint);}
.prop-menu-item .dot{width:7px;height:7px;border-radius:50%;}

.search-box{flex:1;max-width:380px;}
.search-box input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
.search-box input:focus{outline:2px solid var(--azure-tint);border-color:var(--azure);}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
.status-pill{font-size:11.5px;display:flex;align-items:center;gap:5px;color:var(--ink-soft);}
.status-pill .dot{width:6px;height:6px;border-radius:50%;}
.status-pill.online .dot{background:var(--green);}
.status-pill.offline .dot{background:var(--red);}
.bell{position:relative;font-size:16px;color:var(--ink-soft);cursor:pointer;padding:4px;}
.bell .badge{
  position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:9px;
  border-radius:8px;padding:1px 4px;min-width:14px;text-align:center;line-height:1.3;
}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--azure);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}

#content{flex:1;padding:22px 26px 60px;max-width:1500px;width:100%;}

/* Notif dropdown */
.notif-panel{
  position:absolute;top:52px;right:20px;width:320px;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 10px 26px rgba(18,32,58,0.14);z-index:60;display:none;max-height:420px;overflow-y:auto;
}
.notif-panel.open{display:block;}
.notif-item{padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
.notif-item .t{font-weight:600;color:var(--ink);margin-bottom:2px;}
.notif-item .m{color:var(--ink-soft);}

/* ===== Typography ===== */
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:22px;font-weight:600;margin:0;}
.page-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.section-label{font-size:11px;letter-spacing:.3px;color:var(--ink-soft);margin:26px 0 10px;font-weight:600;}
.section-label:first-child{margin-top:0;}

/* ===== KPI cards ===== */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:6px;}
.kpi{background:#fff;padding:14px 16px;}
.kpi .lbl{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
.kpi .val{font-size:22px;font-weight:600;font-family:'Fraunces',serif;}
.kpi .val.small{font-size:17px;}
.kpi .delta{font-size:10.5px;margin-top:4px;}
.kpi .delta.up{color:var(--green);}
.kpi .delta.down{color:var(--red);}

/* ===== Cards/Panels ===== */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.panel-head h3{margin:0;font-size:14.5px;font-weight:600;font-family:'Inter';}
.panel-body{padding:16px;}
.panel-body.flush{padding:0;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr;}}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius);font-size:12.5px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);}
.btn:hover{border-color:var(--azure);}
.btn.primary{background:var(--azure);border-color:var(--azure);color:#fff;}
.btn.primary:hover{background:var(--azure-deep);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.danger{color:var(--red);}
.btn.sm{padding:4px 9px;font-size:11.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ===== Tables ===== */
table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:11px;letter-spacing:.2px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--azure-tint);}
.table-wrap{overflow-x:auto;}
.empty-row td{text-align:center;color:var(--ink-soft);padding:30px;}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.8px;font-weight:600;white-space:nowrap;}
.badge.blue{background:var(--azure-tint);color:var(--azure-deep);}
.badge.teal{background:var(--teal-tint);color:var(--teal);}
.badge.green{background:var(--green-tint);color:var(--green);}
.badge.amber{background:var(--amber-tint);color:var(--amber);}
.badge.red{background:var(--red-tint);color:var(--red);}
.badge.grey{background:#EEEDE6;color:var(--ink-soft);}

/* ===== Forms ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.f-field{display:flex;flex-direction:column;gap:5px;}
.f-field.span2{grid-column:span 2;}
.f-field label{font-size:11.5px;color:var(--ink-soft);font-weight:500;}
.f-field input,.f-field select,.f-field textarea{
  padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
}
.f-field input:focus,.f-field select:focus,.f-field textarea:focus{outline:none;border-color:var(--azure);box-shadow:0 0 0 3px var(--azure-tint);}
.f-field textarea{resize:vertical;min-height:60px;}
.f-hint{font-size:10.5px;color:var(--ink-soft);}

/* ===== Modal ===== */
#modal-backdrop{position:fixed;inset:0;background:rgba(18,32,58,0.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto;}
#modal-backdrop.open{display:flex;}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:640px;box-shadow:0 20px 50px rgba(18,32,58,0.25);}
.modal.wide{max-width:820px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;font-family:'Fraunces',serif;font-weight:600;}
.modal-close{font-size:18px;color:var(--ink-soft);border:none;background:none;padding:2px 6px;}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

/* ===== Room grid ===== */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.room-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;}
.room-card .rc-top{padding:11px 13px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;}
.room-card .rc-num{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
.room-card .rc-body{padding:11px 13px;font-size:12px;}
.room-card .rc-body div{margin-bottom:4px;color:var(--ink-soft);}
.room-card .rc-body strong{color:var(--ink);font-weight:600;}
.room-card .rc-bar{height:4px;}
.room-card .rc-foot{padding:8px 13px;background:var(--paper);display:flex;gap:6px;flex-wrap:wrap;}

/* status colors */
.st-available{background:var(--green);} .st-available-bg{background:var(--green-tint);color:var(--green);}
.st-occupied{background:var(--azure);} .st-occupied-bg{background:var(--azure-tint);color:var(--azure-deep);}
.st-reserved{background:var(--amber);} .st-reserved-bg{background:var(--amber-tint);color:var(--amber);}
.st-cleaning{background:#8A6FB0;} .st-cleaning-bg{background:#EFE9F5;color:#8A6FB0;}
.st-clean{background:var(--teal);} .st-clean-bg{background:var(--teal-tint);color:var(--teal);}
.st-maintenance{background:var(--red);} .st-maintenance-bg{background:var(--red-tint);color:var(--red);}
.st-blocked{background:#5B6B85;} .st-blocked-bg{background:#E7EAEF;color:#5B6B85;}
.st-dirty{background:#A5673F;} .st-dirty-bg{background:#F4E9DF;color:#A5673F;}
.st-inspected{background:#2F8F5B;} .st-inspected-bg{background:var(--green-tint);color:var(--green);}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
.cal-dow{background:var(--paper);text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-soft);padding:7px 0;}
.cal-cell{background:#fff;min-height:104px;padding:6px;font-size:11px;}
.cal-cell .d-num{font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
.cal-cell.today .d-num{color:var(--azure);font-weight:700;}
.cal-cell.faded{background:#F7F6F1;}
.cal-cell.faded .d-num{color:#B9B6A9;}
.cal-chip{font-size:10px;padding:2px 5px;border-radius:2px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.cal-chip.av{background:var(--azure-tint);color:var(--azure-deep);border-left:2px solid var(--azure);}
.cal-chip.as{background:var(--teal-tint);color:var(--teal);border-left:2px solid var(--teal);}

/* Empty state */
.empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
.empty-state .es-ic{font-size:28px;margin-bottom:10px;}
.empty-state .es-t{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px;}

/* Utility */
.flex{display:flex;align-items:center;}
.gap-6{gap:6px;} .gap-8{gap:8px;} .gap-10{gap:10px;} .gap-14{gap:14px;}
.mt-0{margin-top:0;} .mb-0{margin-bottom:0;}
.text-soft{color:var(--ink-soft);}
.text-right{text-align:right;}
.w-full{width:100%;}
.tag-prop{font-size:10px;font-weight:600;padding:2px 6px;border-radius:2px;}
.tag-prop.azurevista{background:var(--azure-tint);color:var(--azure-deep);}
.tag-prop.azuresuite{background:var(--teal-tint);color:var(--teal);}

.step-track{display:flex;margin-bottom:20px;}
.step{flex:1;text-align:center;font-size:11px;color:var(--ink-soft);position:relative;padding-bottom:10px;border-bottom:2px solid var(--line);}
.step.active{color:var(--azure);font-weight:600;border-bottom-color:var(--azure);}
.step.done{color:var(--green);border-bottom-color:var(--green);}

#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at top left,#1B3A63,#0D1A2E 65%);
}
.login-card{background:var(--paper);width:380px;border-radius:4px;padding:36px 34px 30px;box-shadow:0 30px 70px rgba(0,0,0,0.35);}
.login-brand{margin-bottom:26px;}
.login-brand .lb-mark{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--ink);}
.login-brand .lb-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;letter-spacing:.2px;}
.login-foot{margin-top:16px;display:flex;justify-content:space-between;font-size:12px;}
.err-msg{background:var(--red-tint);color:var(--red);padding:8px 11px;border-radius:3px;font-size:12px;margin-bottom:14px;}

@media(max-width:880px){
  #sidebar{position:fixed;left:-222px;transition:left .18s;z-index:200;}
  #sidebar.open{left:0;}
  .search-box{display:none;}
}
@media print{
  #sidebar,#topbar,.no-print{display:none !important;}
  #content{padding:0;}
  body{background:#fff;}
}
</style>
</head>

<script>
/* =========================================================
   AZURE HOSPITALITY — helpers, storage, sample data
========================================================= */
const STORE_KEY = 'azh-data-v2';
function todayStr(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function canViewFinancialTotals(){
  return auth && auth.loggedIn && auth.role === 'Admin';
}
function fmtINR(n){
  if(n == null || isNaN(n)) return '₹0';
  n = Math.round(Number(n)||0);
  return '₹' + n.toLocaleString('en-IN');
}
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateShort(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function fmtDateTime(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' · ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function nightsBetween(a,b){ const ms = new Date(b) - new Date(a); return Math.max(1, Math.round(ms/86400000)); }
function daysDiff(a,b){ return Math.round((new Date(b) - new Date(a))/86400000); }
function addDays(dstr,n){ const d = new Date(dstr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function downloadCSV(filename, rows){
  if(!rows.length){ toast('Nothing to export'); return; }
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(',')].concat(rows.map(r=>headers.map(h=>{
    let v = r[h]==null?'':String(r[h]); if(v.includes(',')||v.includes('"')) v = '"'+v.replace(/"/g,'""')+'"'; return v;
  }).join(','))).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
let toastTimer=null;
function toast(msg){
  let t = document.getElementById('toast-el');
  if(!t){ t = document.createElement('div'); t.id='toast-el';
    t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#12203A;color:#fff;padding:10px 18px;border-radius:4px;font-size:12.5px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.25);';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; },2200);
}

const OTA_PLATFORMS = ['Airbnb','MakeMyTrip','Goibibo','Booking.com','Agoda','Expedia'];
const BOOKING_SOURCES = ['Direct','Walk-in','Phone','WhatsApp','Website','Airbnb','MakeMyTrip','Goibibo','Booking.com','Agoda','Expedia','Corporate','Other OTA'];
const OTA_SOURCES = ['Airbnb','MakeMyTrip','Goibibo','Booking.com','Agoda','Expedia','Other OTA'];
const EXPENSE_CATEGORIES = {
  'Utilities':['Electricity','Water','Internet','Gas'],
  'Operations':['Cleaning','Laundry','Maintenance','Repairs','Security','Housekeeping','Reception','Transportation'],
  'Guest Supplies':['Soap','Shampoo','Conditioner','Toothbrush','Toothpaste','Towels','Bedsheets','Pillows','Blankets','Toiletries'],
  'Property':['Rent','Property tax','Insurance','Furniture','Appliances','Repairs'],
  'Financial':['OTA commission','Payment gateway charges','Bank charges','Refunds'],
  'Other':['Miscellaneous']
};
const INVENTORY_CATEGORIES = ['Toiletries','Cleaning','Linen','Towels','Kitchen','Food supplies','Maintenance','Electrical','Guest amenities','Office supplies'];
const ROLES = ['Owner','Admin','Manager','Receptionist','Housekeeping','Accountant'];

function buildSampleData(){
  const rooms = [
    {id:'RM-101',property:'azurevista',number:'101',type:'Standard',rate:3000,status:'occupied'},
    {id:'RM-102',property:'azurevista',number:'102',type:'Standard',rate:1786,status:'available'},
    {id:'RM-103',property:'azurevista',number:'103',type:'Standard',rate:3125,status:'available'},
    {id:'RM-104',property:'azurevista',number:'104',type:'Standard',rate:1786,status:'available'},
    {id:'RM-105',property:'azurevista',number:'105',type:'Deluxe',rate:3200,status:'available'},
    {id:'RM-106',property:'azurevista',number:'106',type:'Deluxe',rate:3200,status:'available'},
    {id:'RM-107',property:'azurevista',number:'107',type:'Deluxe',rate:3200,status:'available'},
    {id:'RM-108',property:'azurevista',number:'108',type:'Suite',rate:4800,status:'available'},
    {id:'RM-201',property:'azurevista',number:'201',type:'Deluxe',rate:3125,status:'available'},
    {id:'RM-203',property:'azurevista',number:'203',type:'Standard',rate:1786,status:'available'},
  ];
  const units = [
    {id:'UN-1',property:'azuresuite',number:'Azure Suite',type:'2BHK Apartment',rate:6500,status:'available'},
  ];

let state = null;
let saveTimer = null;

function getUserPassword(role){
  if(state && state.userPasswords && state.userPasswords[role]){
    return state.userPasswords[role];
  }
  return role === 'Admin' ? 'admin123' : (role === 'Manager' ? 'manager123' : 'reception123');
}

function setUserPassword(role, newPass){
  if(!state.userPasswords) state.userPasswords = { Admin: 'admin123', Manager: 'manager123', Receptionist: 'reception123' };
  state.userPasswords[role] = newPass;
}

function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      state.lastSync = new Date().toISOString();
      const serialized = JSON.stringify(state);
      if(window.storage && typeof window.storage.set === 'function'){
        try { await window.storage.set(STORE_KEY, serialized, false); } catch(err){}
      }
      if(typeof localStorage !== 'undefined'){
        localStorage.setItem(STORE_KEY, serialized);
      }
      renderTopbarStatus();
    }catch(e){ console.error('Save failed', e); }
  }, 100);
}
async function loadInitial(){
  try{
    let raw = null;
    if(window.storage && typeof window.storage.get === 'function'){
      try {
        const res = await window.storage.get(STORE_KEY, false);
        if(res && res.value) raw = res.value;
      } catch(err){}
    }
    if(!raw && typeof localStorage !== 'undefined'){
      raw = localStorage.getItem(STORE_KEY);
    }
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        state = parsed;
        if(!state.userPasswords) state.userPasswords = { Admin: 'admin123', Manager: 'manager123', Receptionist: 'reception123' };
        if(!state.foodBills) state.foodBills = [];
        if(!state.settings) state.settings = buildSampleData().settings;
        return;
      }
    }
  }catch(e){
    console.error('Error loading stored state:', e);
  }
  state = buildSampleData();
  persist();
}

function computeNotifications(){
  const notifs = [];
  scopedInventory().filter(i=>i.stock<i.minStock).forEach(i=> notifs.push({t:'Low stock', m:`${i.item} — ${i.stock} left (min ${i.minStock}) · ${propName(i.property)}`, kind:'amber'}));
  scopedBookings().filter(b=> (b.payment==='partial') && ['reserved','confirmed','checked-in'].includes(b.status)).forEach(b=> notifs.push({t:'Pending payment', m:`${b.guestName} · ${b.id} · balance ${fmtINR(bookingBalance(b))}`, kind:'red'}));
  scopedBookings().filter(b=> b.checkIn===todayStr() && ['reserved','confirmed'].includes(b.status)).forEach(b=> notifs.push({t:'Upcoming check-in today', m:`${b.guestName} · ${roomLabel(b.roomId)} · ${propName(b.property)}`, kind:'blue'}));
  scopedBookings().filter(b=> b.checkOut===todayStr() && b.status==='checked-in').forEach(b=> notifs.push({t:'Check-out due today', m:`${b.guestName} · ${roomLabel(b.roomId)}`, kind:'blue'}));
  scopedMaintenance().filter(m=> m.status!=='Completed').forEach(m=> notifs.push({t:'Maintenance open', m:`${m.issue} · ${roomLabel(m.roomId)} · ${m.priority} priority`, kind:'red'}));
  scopedBookings().filter(b=> b.source!=='Direct' && OTA_SOURCES.includes(b.source) && b.createdDate===todayStr()).forEach(b=> notifs.push({t:'OTA booking received', m:`${b.source} · ${b.guestName} · ${propName(b.property)}`, kind:'teal'}));
  return notifs;
}
function bookingFoodBills(b){
  if(!b) return [];
  if(!state.foodBills) state.foodBills = [];
  return state.foodBills.filter(f=> f.bookingId===b.id);
}

function bookingFoodTotal(b){
  return bookingFoodBills(b).reduce((s,f)=> s + (f.amount||0), 0);
}

function bookingTotalCharges(b){
  if(!b) return { nights:0, roomCharges:0, foodCharges:0, discount:0, gross:0, taxPct:0, tax:0, total:0, paid:0, balance:0 };
  const nights = nightsBetween(b.checkIn, b.checkOut);
  const roomCharges = nights * (b.rate || 0) + (b._extra || 0);
  const foodCharges = bookingFoodTotal(b);
  const discount = b.discount || 0;
  const gross = Math.max(0, roomCharges + foodCharges - discount);
  const taxPct = (state.settings && state.settings.tax) ? (state.settings.tax.cgst + state.settings.tax.sgst + state.settings.tax.igst) : 12;
  const tax = Math.round(gross * taxPct / 100);
  const total = gross + tax;
  const paid = (state.payments || []).filter(p => p.bookingId === b.id).reduce((s, p) => s + p.amount, 0);
  const balance = Math.max(0, total - paid);
  return { nights, roomCharges, foodCharges, discount, gross, taxPct, tax, total, paid, balance };
}

function bookingBalance(b){
  return bookingTotalCharges(b).balance;
}

function propStats(prop, dateFrom, dateTo){
  const bks = state.bookings.filter(b=> b.property===prop);
  const inRange = (d)=> d>=dateFrom && d<=dateTo;
  let revenue=0, expenses=0, otaComm=0;
  bks.forEach(b=>{
    // attribute revenue to nights that fall within range (simplified: use booking creation/stay overlap by check-in date within range)
    if(inRange(b.checkIn)){
      const nights = nightsBetween(b.checkIn,b.checkOut);
      const gross = nights*b.rate - (b.discount||0);
      revenue += gross;
      if(OTA_SOURCES.includes(b.source)) otaComm += gross*0.18;
    }
  });
  state.expenses.filter(e=>e.property===prop && inRange(e.date)).forEach(e=> expenses += e.amount);
  const roomsForProp = prop==='azurevista'? state.rooms.filter(r=>r.property===prop) : state.units.filter(u=>u.property===prop);
  const occupied = roomsForProp.filter(r=>r.status==='occupied').length;
  const occPct = roomsForProp.length? Math.round(occupied/roomsForProp.length*100) : 0;
  return { revenue, expenses, otaComm, profit: revenue-expenses-otaComm, occPct, bookingsCount: bks.filter(b=>inRange(b.checkIn)).length, totalUnits: roomsForProp.length };
}
function todayKPIs(){
  const bks = ui.property==='all' ? state.bookings : state.bookings.filter(b=>b.property===ui.property);
  const checkins = bks.filter(b=> b.checkIn===todayStr()).length;
  const checkouts = bks.filter(b=> b.checkOut===todayStr()).length;
  const newBookings = bks.filter(b=> b.createdDate===todayStr()).length;
  const pays = scopedPayments().filter(p=>p.date===todayStr());
  const revenue = pays.reduce((s,p)=>s+p.amount,0);
  const exp = scopedExpenses().filter(e=>e.date===todayStr()).reduce((s,e)=>s+e.amount,0);
  const pending = bks.filter(b=>['reserved','confirmed','checked-in'].includes(b.status)).reduce((s,b)=>s+bookingBalance(b),0);
  return {checkins,checkouts,newBookings,revenue,expenses:exp,net:revenue-exp,pending};
}
function currentStatusCounts(){
  const rs = scopedRooms();
  const c = {available:0,occupied:0,reserved:0,cleaning:0,maintenance:0,blocked:0};
  rs.forEach(r=>{ if(c[r.status]!=null) c[r.status]++; });
  return {total:rs.length, ...c};
}

function statusBadge(status){
  const map = {
    'reserved':['amber','Reserved'],'confirmed':['blue','Confirmed'],'checked-in':['green','Checked-in'],
    'checked-out':['grey','Checked-out'],'cancelled':['red','Cancelled'],'no-show':['red','No-show'],
    'available':['green','Available'],'occupied':['blue','Occupied'],'cleaning':['grey','Cleaning'],
    'maintenance':['red','Maintenance'],'blocked':['grey','Blocked'],'dirty':['amber','Dirty'],
    'clean':['teal','Clean'],'inspected':['green','Inspected'],
    'paid':['green','Paid'],'partial':['amber','Partial'],'unpaid':['red','Unpaid'],
  };
  const m = map[status] || ['grey', status];
  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}

  if(bookingsFilter.status!=='all') bks = bks.filter(b=>b.status===bookingsFilter.status);
  if(bookingsFilter.source!=='all') bks = bks.filter(b=> (bookingsFilter.source==='OTA'? OTA_SOURCES.includes(b.source) : b.source===bookingsFilter.source));
  if(bookingsFilter.q) bks = bks.filter(b=> (b.guestName+b.id+b.mobile).toLowerCase().includes(bookingsFilter.q.toLowerCase()));
  bks = bks.slice().sort((a,b)=> b.checkIn.localeCompare(a.checkIn));
  return `
  <div class="page-head">
    <div><h1 class="page-title">Bookings</h1><div class="page-sub">${bks.length} booking${bks.length!==1?'s':''} · ${propName(ui.property)}</div></div>
    <div class="flex gap-8">
      <button class="btn danger sm" id="bk-clear-all">Clear All Bookings</button>
      <button class="btn sm" id="bk-export">Export CSV</button>
      <button class="btn primary sm" id="bk-new">+ New Booking</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head" style="gap:10px;flex-wrap:wrap;">
      <div class="flex gap-8" style="flex-wrap:wrap;">
        <input id="bk-q" placeholder="Search guest, ID, mobile…" value="${esc(bookingsFilter.q)}" style="padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:12.5px;width:220px;"/>
        <select id="bk-status-filter" style="padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:12.5px;">
          <option value="all">All statuses</option>
          ${['reserved','confirmed','checked-in','checked-out','cancelled','no-show'].map(s=>`<option value="${s}" ${bookingsFilter.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select id="bk-source-filter" style="padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:12.5px;">
          <option value="all">All sources</option><option value="OTA">All OTA</option>
          ${BOOKING_SOURCES.map(s=>`<option value="${s}" ${bookingsFilter.source===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="panel-body flush table-wrap">
      <table>
        <thead><tr><th>Booking</th><th>Property</th><th>Room/Unit</th><th>Guest</th><th>Check-in</th><th>Check-out</th><th>Source</th><th>Status</th><th>Payment</th><th class="text-right">Balance</th><th class="text-right">Action</th></tr></thead>
        <tbody>
        ${bks.length? bks.map(b=>`
          <tr>
            <td><strong>${b.id}</strong></td>
            <td><span class="tag-prop ${b.property}">${propName(b.property)}</span></td>
            <td>${roomLabel(b.roomId)}</td>
            <td>${esc(b.guestName)}<div class="text-soft" style="font-size:11px;">${esc(b.mobile)}</div></td>
            <td>${fmtDateShort(b.checkIn)}</td>
            <td>${fmtDateShort(b.checkOut)}</td>
            <td>${sourceBadge(b.source)}</td>
            <td>${statusBadge(b.status)}</td>
            <td>${statusBadge(b.payment)}</td>
            <td class="text-right">${fmtINR(bookingBalance(b))}</td>
            <td class="text-right">
              <div class="flex gap-4" style="justify-content:flex-end;flex-wrap:nowrap;">
                <button class="btn sm" data-view-booking="${b.id}">View</button>
                <button class="btn sm primary" data-food-booking="${b.id}" title="Add Food Bill">🍽️ Food</button>
                <button class="btn sm" data-bill-booking="${b.id}" title="Generate Bill">Bill 📄</button>
                <button class="btn sm" data-edit-booking="${b.id}" title="Edit Booking">✏️ Edit</button>
                <button class="btn sm danger" data-delete-booking="${b.id}" title="Delete Booking">🗑️ Delete</button>
              </div>
            </td>
          </tr>`).join('') : `<tr class="empty-row"><td colspan="11">No bookings match these filters.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}
function events_bookings(){
  document.getElementById('bk-new').onclick = openBookingModal;
  document.getElementById('bk-export').onclick = ()=> downloadCSV('bookings.csv', scopedBookings().map(b=>({id:b.id,property:b.property,room:roomLabel(b.roomId),guest:b.guestName,mobile:b.mobile,checkIn:b.checkIn,checkOut:b.checkOut,source:b.source,status:b.status,payment:b.payment,balance:bookingBalance(b)})));
  document.getElementById('bk-q').oninput = (e)=>{ bookingsFilter.q=e.target.value; render(); document.getElementById('bk-q').focus(); const v=document.getElementById('bk-q'); v.setSelectionRange(v.value.length,v.value.length); };
  document.getElementById('bk-status-filter').onchange = (e)=>{ bookingsFilter.status=e.target.value; render(); };
  document.getElementById('bk-source-filter').onchange = (e)=>{ bookingsFilter.source=e.target.value; render(); };
  const clearBtn = document.getElementById('bk-clear-all');
  if(clearBtn) clearBtn.onclick = () => confirmAction(
    'Delete all payments, expenses, guest & booking details?',
    'This will permanently clear all bookings, guests, payments, expenses, invoices, and food bills. Room statuses will reset to available.',
    () => {
      clearAllRecords();
      toast('All payment, expense, guest & booking details deleted');
      render();
    }
  );
  document.querySelectorAll('[data-view-booking]').forEach(el=> el.onclick = ()=> openBookingDetail(el.dataset.viewBooking));
  document.querySelectorAll('[data-food-booking]').forEach(el => el.onclick = () => openAddFoodBillModal(el.dataset.foodBooking));
  document.querySelectorAll('[data-bill-booking]').forEach(el => el.onclick = () => openBookingBillPrint(el.dataset.billBooking));
  document.querySelectorAll('[data-edit-booking]').forEach(el => el.onclick = () => openEditBookingModal(el.dataset.editBooking));
  document.querySelectorAll('[data-delete-booking]').forEach(el => el.onclick = () => deleteBooking(el.dataset.deleteBooking));
}

function availableRoomsForProperty(prop){
  return prop==='azurevista' ? state.rooms.filter(r=>r.property==='azurevista') : state.units.filter(u=>u.property==='azuresuite');
}
function openBookingModal(prefill){
  prefill = prefill || {};
  const prop = prefill.property || (ui.property!=='all'?ui.property:'azurevista');
  const rooms = availableRoomsForProperty(prop);
  const body = `
    <div class="form-grid" id="bk-form">
      <div class="f-field"><label>Property</label><select id="f-property">
        <option value="azurevista" ${prop==='azurevista'?'selected':''}>Azurevista — Gorakhpur</option>
        <option value="azuresuite" ${prop==='azuresuite'?'selected':''}>Azure Suite — Lucknow</option>
      </select></div>
      <div class="f-field"><label>Room / Unit</label><select id="f-room">${rooms.map(r=>`<option value="${r.id}">${r.property==='azurevista'?'Room '+r.number+' — '+r.type:r.number} (${fmtINR(r.rate)}/night)</option>`).join('')}</select></div>
      <div class="f-field span2"><label>Guest name</label><input id="f-guestname" placeholder="Full name"/></div>
      <div class="f-field"><label>Mobile number</label><input id="f-mobile" placeholder="98XXXXXXXX"/></div>
      <div class="f-field"><label>Email</label><input id="f-email" placeholder="guest@example.com"/></div>
      <div class="f-field"><label>Adults</label><input id="f-adults" type="number" min="1" value="2"/></div>
      <div class="f-field"><label>Children</label><input id="f-children" type="number" min="0" value="0"/></div>
      <div class="f-field"><label>Check-in date</label><input id="f-checkin" type="date" value="${todayStr()}"/></div>
      <div class="f-field"><label>Check-out date</label><input id="f-checkout" type="date" value="${addDays(todayStr(),1)}"/></div>
      <div class="f-field"><label>Room/unit rate (₹/night)</label><input id="f-rate" type="number" value="${rooms[0]?rooms[0].rate:0}"/></div>
      <div class="f-field"><label>Discount (₹)</label><input id="f-discount" type="number" value="0"/></div>
      <div class="f-field"><label>Advance payment (₹)</label><input id="f-advance" type="number" value="0"/></div>
      <div class="f-field"><label>Booking source</label><select id="f-source">${BOOKING_SOURCES.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="f-field span2"><label>Special requests / notes</label><textarea id="f-notes" placeholder="Optional"></textarea></div>
    </div>
    <div id="bk-form-err"></div>
  `;
  const foot = `<button class="btn" id="bk-cancel">Cancel</button><button class="btn primary" id="bk-save">Save booking</button>`;
  openModal('New booking', body, foot, true);
  const roomSel = document.getElementById('f-room'), rateInp = document.getElementById('f-rate'), propSel = document.getElementById('f-property');
  function refreshRooms(){
    const rs = availableRoomsForProperty(propSel.value);
    roomSel.innerHTML = rs.map(r=>`<option value="${r.id}">${r.property==='azurevista'?'Room '+r.number+' — '+r.type:r.number} (${fmtINR(r.rate)}/night)</option>`).join('');
    if(rs[0]) rateInp.value = rs[0].rate;
  }
  propSel.onchange = refreshRooms;
  roomSel.onchange = ()=>{ const r = rooms.concat(state.rooms,state.units).find(x=>x.id===roomSel.value); if(r) rateInp.value = r.rate; };
  document.getElementById('bk-cancel').onclick = closeModal;
  document.getElementById('bk-save').onclick = ()=>{
    const name = document.getElementById('f-guestname').value.trim();
    const mobile = document.getElementById('f-mobile').value.trim();
    const ci = document.getElementById('f-checkin').value, co = document.getElementById('f-checkout').value;
    const errBox = document.getElementById('bk-form-err');
    if(!name || !mobile){ errBox.innerHTML = `<div class="err-msg">Guest name and mobile number are required.</div>`; return; }
    if(new Date(co) <= new Date(ci)){ errBox.innerHTML = `<div class="err-msg">Check-out must be after check-in.</div>`; return; }
    const roomId = document.getElementById('f-room').value;
    const conflict = state.bookings.some(b=> b.roomId===roomId && !['cancelled','checked-out','no-show'].includes(b.status) && ci < b.checkOut && co > b.checkIn);
    if(conflict){ errBox.innerHTML = `<div class="err-msg">This room/unit is already booked for overlapping dates. Choose different dates or a different room.</div>`; return; }
    let guest = state.guests.find(g=> g.mobile===mobile);
    if(!guest){ guest = {id:uid('GU'),name,mobile,email:document.getElementById('f-email').value.trim(),address:'',idType:'',idNumber:'',properties:[document.getElementById('f-property').value],totalStays:0,totalSpend:0,outstanding:0}; state.guests.push(guest); }
    const booking = {
      id: uid('BK'), property: document.getElementById('f-property').value, roomId, guestId:guest.id, guestName:name, mobile,
      email: document.getElementById('f-email').value.trim(), adults:+document.getElementById('f-adults').value||1, children:+document.getElementById('f-children').value||0,
      checkIn:ci, checkInTime:'13:00', checkOut:co, checkOutTime:'11:00', rate:+document.getElementById('f-rate').value||0,
      discount:+document.getElementById('f-discount').value||0, advance:+document.getElementById('f-advance').value||0,
      source: document.getElementById('f-source').value, status: ci<=todayStr()?'confirmed':'reserved', payment: (+document.getElementById('f-advance').value>0?'partial':'unpaid'),
      notes: document.getElementById('f-notes').value.trim(), createdBy: auth.user, createdDate: todayStr(),
    };
    state.bookings.push(booking);
    if(+booking.advance>0){ state.payments.push({id:uid('TXN'),bookingId:booking.id,property:booking.property,amount:+booking.advance,method:'Cash',date:todayStr(),notes:'Advance at booking',addedBy:auth.user}); }
    const r = roomObj(roomId); if(r && ci===todayStr()) r.status='reserved';
    logAudit('Booking created', booking.property, booking.id);
    persist(); closeModal(); toast('Booking '+booking.id+' created'); ui.view='bookings'; render();
  };
}
function logAudit(action, property, record){ state.auditLog.unshift({id:uid('AL'),user:auth.user,action,property,record,date:new Date().toISOString()}); if(state.auditLog.length>200) state.auditLog.pop(); }

  const editBtn = document.getElementById('bk-edit-booking');
  if(editBtn) editBtn.onclick = () => openEditBookingModal(b.id);
  const delBtn = document.getElementById('bk-delete-booking');
  if(delBtn) delBtn.onclick = () => deleteBooking(b.id);

  });
}

function openAddFoodBillModal(bookingId){
  const openBks = state.bookings.filter(b=>!['cancelled','checked-out','no-show'].includes(b.status));
  const defaultBooking = state.bookings.find(b=>b.id===bookingId) || openBks[0] || state.bookings[0];

  const body = `
    <div class="form-grid">
      <div class="f-field span2">
        <label>Select Booking</label>
        <select id="fb-booking">
          ${openBks.map(b => `<option value="${b.id}" ${b.id===(defaultBooking?defaultBooking.id:'')?'selected':''}>${b.id} — ${esc(b.guestName)} (${roomLabel(b.roomId)})</option>`).join('')}
        </select>
      </div>

      <div class="f-field span2">
        <label>Item Name / Description *</label>
        <input id="fb-desc" placeholder="e.g. Water bottle, Meal, Tea, Snacks, Laundry"/>
      </div>

      <div class="f-field">
        <label>Price / Amount (₹) *</label>
        <input id="fb-amount" type="number" min="1" placeholder="e.g. 150" style="font-weight:700;color:var(--azure);"/>
      </div>

      <div class="f-field">
        <label>Date</label>
        <input id="fb-date" type="date" value="${todayStr()}"/>
      </div>
    </div>
    <div id="fb-err"></div>
  `;

  const foot = `
    <button class="btn" id="fb-cancel">Cancel</button>
    <button class="btn primary" id="fb-save">🍽️ Add Bill Item</button>
  `;

  openModal('Add Food / Service Bill', body, foot);

  const descInp = document.getElementById('fb-desc');
  const amountInp = document.getElementById('fb-amount');

  document.getElementById('fb-cancel').onclick = closeModal;

  document.getElementById('fb-save').onclick = () => {
    const bId = document.getElementById('fb-booking').value;
    const b = bookingObj(bId);
    if(!b){
      document.getElementById('fb-err').innerHTML = `<div class="err-msg">Select a valid booking.</div>`;
      return;
    }
    const desc = descInp.value.trim();
    const amount = +amountInp.value;
    if(!desc){
      document.getElementById('fb-err').innerHTML = `<div class="err-msg">Please enter item name / description (e.g. Water bottle, Meal).</div>`;
      return;
    }
    if(!amount || amount <= 0){
      document.getElementById('fb-err').innerHTML = `<div class="err-msg">Please enter a valid price/amount.</div>`;
      return;
    }

    if(!state.foodBills) state.foodBills = [];

    const newFoodBill = {
      id: uid('FB'),
      bookingId: bId,
      property: b.property,
      description: desc,
      quantity: 1,
      unitPrice: amount,
      amount,
      date: document.getElementById('fb-date').value || todayStr(),
      addedBy: auth.user
    };

    state.foodBills.push(newFoodBill);

    if(bookingBalance(b) <= 0) b.payment = 'paid';
    else b.payment = 'partial';

    logAudit('Food bill added', b.property, bId);
    persist();
    closeModal();

function openEditBookingModal(bookingId){
  const b = bookingObj(bookingId);
  if(!b) return;
  const prop = b.property;
  const rooms = availableRoomsForProperty(prop);

  const body = `
    <div class="form-grid">
      <div class="f-field span2"><label>Guest name</label><input id="eb-guestname" value="${esc(b.guestName)}"/></div>
      <div class="f-field"><label>Mobile number</label><input id="eb-mobile" value="${esc(b.mobile)}"/></div>
      <div class="f-field"><label>Email</label><input id="eb-email" value="${esc(b.email||'')}"/></div>
      <div class="f-field"><label>Room / Unit</label><select id="eb-room">${rooms.map(r=>`<option value="${r.id}" ${r.id===b.roomId?'selected':''}>${r.property==='azurevista'?'Room '+r.number+' — '+r.type:r.number} (${fmtINR(r.rate)}/night)</option>`).join('')}</select></div>
      <div class="f-field"><label>Rate (₹/night)</label><input id="eb-rate" type="number" value="${b.rate}"/></div>
      <div class="f-field"><label>Check-in date</label><input id="eb-checkin" type="date" value="${b.checkIn}"/></div>
      <div class="f-field"><label>Check-out date</label><input id="eb-checkout" type="date" value="${b.checkOut}"/></div>
      <div class="f-field"><label>Discount (₹)</label><input id="eb-discount" type="number" value="${b.discount||0}"/></div>
      <div class="f-field"><label>Booking source</label><select id="eb-source">${BOOKING_SOURCES.map(s=>`<option ${s===b.source?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="f-field span2"><label>Notes</label><textarea id="eb-notes">${esc(b.notes||'')}</textarea></div>
    </div>
    <div id="eb-err"></div>
  `;

  const foot = `<button class="btn" id="eb-cancel">Cancel</button><button class="btn primary" id="eb-save">Save changes</button>`;
  openModal('Edit booking ' + b.id, body, foot, true);

  document.getElementById('eb-cancel').onclick = closeModal;
  document.getElementById('eb-save').onclick = () => {
    const name = document.getElementById('eb-guestname').value.trim();
    const mobile = document.getElementById('eb-mobile').value.trim();
    const ci = document.getElementById('eb-checkin').value;
    const co = document.getElementById('eb-checkout').value;
    if(!name || !mobile){
      document.getElementById('eb-err').innerHTML = `<div class="err-msg">Guest name and mobile are required.</div>`;
      return;
    }
    if(new Date(co) <= new Date(ci)){
      document.getElementById('eb-err').innerHTML = `<div class="err-msg">Check-out must be after check-in.</div>`;
      return;
    }

    b.guestName = name;
    b.mobile = mobile;
    b.email = document.getElementById('eb-email').value.trim();
    b.roomId = document.getElementById('eb-room').value;
    b.rate = +document.getElementById('eb-rate').value || b.rate;
    b.checkIn = ci;
    b.checkOut = co;
    b.discount = +document.getElementById('eb-discount').value || 0;
    b.source = document.getElementById('eb-source').value;
    b.notes = document.getElementById('eb-notes').value.trim();

    if(bookingBalance(b) <= 0) b.payment = 'paid';
    else b.payment = 'partial';

    logAudit('Booking edited', b.property, b.id);
    persist();
    closeModal();
    toast('Booking ' + b.id + ' updated');
    render();
    openBookingDetail(b.id);
  };
}

function deleteBooking(bookingId){
  const b = bookingObj(bookingId);
  if(!b) return;
  confirmAction(`Delete booking ${b.id}?`, `Are you sure you want to delete this booking for ${b.guestName}? This action cannot be undone.`, () => {
    state.bookings = state.bookings.filter(x => x.id !== bookingId);
    state.foodBills = (state.foodBills || []).filter(x => x.bookingId !== bookingId);
    const r = roomObj(b.roomId);
    if(r && r.status === 'occupied' && !state.bookings.some(x => x.roomId === b.roomId && x.status === 'checked-in')){
      r.status = 'available';
    }
    logAudit('Booking deleted', b.property, b.id);
    persist();
    closeModal();
    toast(`Booking ${b.id} deleted`);
    render();
  });
}

function confirmAction(title, msg, onConfirm){
  const body = `<div>${esc(msg)}</div>`;
  const foot = `<button class="btn" id="ca-cancel">Cancel</button><button class="btn danger" id="ca-confirm">Confirm</button>`;
  openModal(title, body, foot);
  document.getElementById('ca-cancel').onclick = closeModal;
  document.getElementById('ca-confirm').onclick = onConfirm;
}

/* =========================================================
   VIEW: CALENDAR
========================================================= */
let calMonth = 8; // 0-indexed: Sept 2026
let calYear = 2026;
function viewCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, faded:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, faded:false, dateStr: `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length%7!==0) cells.push({d:cells.length, faded:true});
  const bks = scopedBookings().filter(b=>b.status!=='cancelled');
  const monthLabel = first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return `
  <div class="page-head">
    <div><h1 class="page-title">Central booking calendar</h1><div class="page-sub">${propName(ui.property)} · month view</div></div>
    <div class="flex gap-8">
      <button class="btn sm" id="cal-prev">‹ Prev</button>
      <div class="btn sm" style="min-width:150px;justify-content:center;">${monthLabel}</div>
      <button class="btn sm" id="cal-next">Next ›</button>
      <button class="btn primary sm" id="cal-new">+ New Booking</button>
    </div>
  </div>
  <div class="flex gap-14" style="margin-bottom:12px;font-size:12px;">
    <span class="flex gap-6"><span style="width:9px;height:9px;background:var(--azure);display:inline-block;border-radius:2px;"></span> Azurevista</span>
    <span class="flex gap-6"><span style="width:9px;height:9px;background:var(--teal);display:inline-block;border-radius:2px;"></span> Azure Suite</span>
  </div>
  <div class="cal-grid">
    ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(c=>{
      if(c.faded) return `<div class="cal-cell faded"><div class="d-num">${c.d}</div></div>`;
      const dayBookings = bks.filter(b=> c.dateStr>=b.checkIn && c.dateStr<b.checkOut);
      const isToday = c.dateStr===todayStr();
      return `<div class="cal-cell ${isToday?'today':''}">
        <div class="d-num">${c.d}</div>
        ${dayBookings.slice(0,3).map(b=>`<div class="cal-chip ${b.property==='azurevista'?'av':'as'}" data-view-booking="${b.id}" title="${esc(b.guestName)}">${esc(b.guestName)} · ${roomLabel(b.roomId)}</div>`).join('')}
        ${dayBookings.length>3?`<div class="text-soft" style="font-size:10px;">+${dayBookings.length-3} more</div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}
function events_calendar(){
  document.getElementById('cal-prev').onclick = ()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); };
  document.getElementById('cal-next').onclick = ()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); };
  document.getElementById('cal-new').onclick = openBookingModal;
  document.querySelectorAll('[data-view-booking]').forEach(el=> el.onclick = ()=> openBookingDetail(el.dataset.viewBooking));
}

const CHECKIN_STEPS = ['Select booking','Verify guest','Verify ID','Confirm room','Advance payment','Notes','Complete'];
const CHECKOUT_STEPS = ['Open booking','Review charges','Extra services','Final amount','Discount','Tax','Payment','Invoice','Complete'];
function renderWorkflow(){
  const b = bookingObj(ui.selectedId);
  if(!b){ ui.workflow=null; return viewCheckInOut(); }
  const steps = ui.workflow==='checkin'?CHECKIN_STEPS:CHECKOUT_STEPS;
  const step = ui.step||0;
  let inner = '';
  if(ui.workflow==='checkin'){
    inner = [
      `<p>Booking <strong>${b.id}</strong> for <strong>${esc(b.guestName)}</strong>, ${roomLabel(b.roomId)}, ${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)}.</p>`,

      `<p>ID verified on file. Government ID is mandatory before handing over keys.</p>`,

      `<div class="f-field"><label>Advance payment collected now (₹)</label><input id="wf-advance" type="number" value="${b.advance||0}"/></div><div class="f-field" style="margin-top:8px;"><label>Payment method</label><select id="wf-method"><option>Cash</option><option>UPI</option><option>Debit Card</option><option>Credit Card</option><option>Bank Transfer</option></select></div>`,
      `<div class="f-field"><label>Notes</label><textarea id="wf-notes">${esc(b.notes||'')}</textarea></div>`,
      `<p>Ready to complete check-in. This will mark the booking <strong>Checked-in</strong> and the room <strong>Occupied</strong>.</p>`
    ][step];
  } else {
    const nights = nightsBetween(b.checkIn,b.checkOut);
    const gross = nights*b.rate-(b.discount||0);
    const taxPct = state.settings.tax.cgst+state.settings.tax.sgst+state.settings.tax.igst;
    inner = [
      `<p>Booking <strong>${b.id}</strong> for <strong>${esc(b.guestName)}</strong>, ${roomLabel(b.roomId)}.</p>`,
      `<table><tbody><tr><td>Room charges (${nights} night${nights>1?'s':''} × ${fmtINR(b.rate)})</td><td class="text-right">${fmtINR(nights*b.rate)}</td></tr></tbody></table>`,
      `<div class="f-field"><label>Extra charges — food, laundry, extra bed (₹)</label><input id="wf-extra" type="number" value="0"/></div>`,
      `<p>Subtotal so far: <strong id="wf-subtotal-display">${fmtINR(gross)}</strong></p>`,
      `<div class="f-field"><label>Discount (₹)</label><input id="wf-discount" type="number" value="${b.discount||0}"/></div>`,
      `<p>Tax rate configured in Settings: <strong>${taxPct}%</strong> (CGST ${state.settings.tax.cgst}% + SGST ${state.settings.tax.sgst}% + IGST ${state.settings.tax.igst}%)</p>`,
      `<div class="f-field"><label>Payment method for balance</label><select id="wf-method"><option>Cash</option><option>UPI</option><option>Debit Card</option><option>Credit Card</option><option>Bank Transfer</option></select></div>`,
      `<p>An invoice will be generated automatically on completion.</p>`,
      `<p>Ready to complete check-out. This will mark the booking <strong>Checked-out</strong> and the room <strong>Cleaning</strong>, and notify housekeeping.</p>`
    ][step];
  }
  return `
  <div class="page-head"><div><h1 class="page-title">${ui.workflow==='checkin'?'Check-in':'Check-out'} — ${b.id}</h1><div class="page-sub">${esc(b.guestName)} · ${roomLabel(b.roomId)}</div></div>
    <button class="btn ghost sm" id="wf-exit">Exit workflow</button></div>
  <div class="panel"><div class="panel-body">
    <div class="step-track">${steps.map((s,i)=>`<div class="step ${i===step?'active':i<step?'done':''}">${i+1}. ${s}</div>`).join('')}</div>
    <div style="min-height:100px;">${inner}</div>
    <div id="wf-err"></div>
    <div class="flex" style="justify-content:space-between;margin-top:20px;">
      <button class="btn" id="wf-back" ${step===0?'disabled':''}>Back</button>
      <button class="btn primary" id="wf-next">${step===steps.length-1?'Complete':'Continue'}</button>
    </div>
  </div></div>`;
}
function events_checkinout(){
  if(ui.selectedId && ui.workflow){
    document.getElementById('wf-exit').onclick = ()=>{ ui.selectedId=null; ui.workflow=null; render(); };
    document.getElementById('wf-back').onclick = ()=>{ ui.step=Math.max(0,(ui.step||0)-1); render(); };
    document.getElementById('wf-next').onclick = ()=> advanceWorkflow();
    return;
  }
  document.querySelectorAll('[data-start-checkin]').forEach(el=> el.onclick = ()=>{ ui.selectedId=el.dataset.startCheckin; ui.workflow='checkin'; ui.step=0; render(); });
  document.querySelectorAll('[data-start-checkout]').forEach(el=> el.onclick = ()=>{ ui.selectedId=el.dataset.startCheckout; ui.workflow='checkout'; ui.step=0; render(); });
}
function advanceWorkflow(){
  const b = bookingObj(ui.selectedId);
  const steps = ui.workflow==='checkin'?CHECKIN_STEPS:CHECKOUT_STEPS;
  const step = ui.step||0;
  if(ui.workflow==='checkin' && step===4){ const adv=document.getElementById('wf-advance'); if(adv){ const amt=+adv.value||0; if(amt>0){ state.payments.push({id:uid('TXN'),bookingId:b.id,property:b.property,amount:amt,method:document.getElementById('wf-method').value,date:todayStr(),notes:'Check-in advance',addedBy:auth.user}); b.advance=amt; } } }
  if(ui.workflow==='checkin' && step===5){ const n=document.getElementById('wf-notes'); if(n) b.notes=n.value; }
  if(ui.workflow==='checkout' && step===2){ const ex=document.getElementById('wf-extra'); if(ex) b._extra = +ex.value||0; }
  if(ui.workflow==='checkout' && step===4){ const d=document.getElementById('wf-discount'); if(d) b.discount = +d.value||0; }
  if(step===steps.length-1){
    if(ui.workflow==='checkin'){
      b.status='checked-in'; const r=roomObj(b.roomId); if(r) r.status='occupied';
      logAudit('Check-in completed', b.property, b.id); persist(); toast('Check-in complete'); ui.selectedId=null; ui.workflow=null; render();
    } else {
      b.status='checked-out'; const r=roomObj(b.roomId); if(r) r.status='cleaning';
      state.housekeeping.push({id:uid('HK'),property:b.property,roomId:b.roomId,status:'dirty',assignedTo:'Unassigned',checkoutTime:new Date().toTimeString().slice(0,5),notes:'Auto-created on checkout'});
      const charges = bookingTotalCharges(b);
      const gross = charges.gross;
      const tax = charges.tax;
      const total = charges.total;
      const paid = charges.paid;
      const balance = charges.balance;
      if(balance>0){ state.payments.push({id:uid('TXN'),bookingId:b.id,property:b.property,amount:balance,method:document.getElementById('wf-method')?document.getElementById('wf-method').value:'Cash',date:todayStr(),notes:'Checkout settlement — Room & Food Bills',addedBy:auth.user}); }
      b.payment='paid';
      const invNum = state.settings.invoicePrefix + String(state.invoiceSeq++).padStart(4,'0');
      state.invoices.push({id:invNum,bookingId:b.id,property:b.property,guestName:b.guestName,date:todayStr(),roomCharges:charges.roomCharges,foodCharges:charges.foodCharges,subtotal:gross,discount:b.discount||0,tax,total,advance:paid+balance,balance:0});
      const g = guestObj(b.guestId); if(g){ g.totalStays++; g.totalSpend+=total; g.outstanding=Math.max(0,g.outstanding-balance); }
      logAudit('Check-out completed', b.property, b.id); logAudit('Invoice generated', b.property, invNum);
      persist(); toast('Check-out complete · Invoice '+invNum+' generated'); ui.selectedId=null; ui.workflow=null; render();
      openInvoicePrint(invNum);
    }
    return;
  }
  ui.step = step+1; render();
}

function deletePayment(paymentId, onDone){
  const p = (state.payments || []).find(x => x.id === paymentId);
  if(!p) return;
  confirmAction(`Delete payment ${p.id}?`, `Are you sure you want to delete payment of ${fmtINR(p.amount)} (${p.method})? This action cannot be undone.`, () => {
    const bookingId = p.bookingId;
    state.payments = (state.payments || []).filter(x => x.id !== paymentId);
    const b = bookingObj(bookingId);
    if(b){
      const paid = (state.payments || []).filter(x => x.bookingId === b.id).reduce((s, x) => s + x.amount, 0);
      if(paid <= 0) b.payment = 'unpaid';
      else if(bookingBalance(b) <= 0) b.payment = 'paid';
      else b.payment = 'partial';
    }
    logAudit('Payment deleted', p.property, p.id);
    persist();
    closeModal();
    toast(`Payment ${p.id} deleted`);
    render();
    if(typeof onDone === 'function'){
      onDone();
    }
  });
}

function openPaymentBillPrint(paymentId){
  const p = state.payments.find(x=>x.id===paymentId);
  if(!p) return;
  const b = bookingObj(p.bookingId);
  const prop = state.properties[p.property] || state.properties['azurevista'];
  const nights = b ? nightsBetween(b.checkIn, b.checkOut) : 1;
  const gross = b ? (nights * b.rate - (b.discount||0)) : p.amount;
  const taxPct = state.settings.tax.cgst + state.settings.tax.sgst + state.settings.tax.igst;
  const tax = Math.round(gross * taxPct / 100);
  const totalBill = gross + tax;

function logOTASync(property, platform, type, message, status = 'Success'){
  if(!state.otaSyncLogs) state.otaSyncLogs = [];
  state.otaSyncLogs.unshift({
    id: uid('SYNC'),
    timestamp: new Date().toISOString(),
    property,
    platform,
    type,
    message,
    status
  });
  if(state.otaSyncLogs.length > 50) state.otaSyncLogs.pop();
}

function pushAvailabilityToOTAs(property, roomId, actionType){
  if(!state.ota) return;
  OTA_PLATFORMS.forEach(plat => {
    const conn = state.ota[property+'|'+plat];
    if(conn && conn.status === 'connected'){
      conn.lastSync = new Date().toISOString();
      logOTASync(property, plat, 'AVAILABILITY_PUSH', `2-Way Sync (${actionType}): Room ${roomId} inventory updated across channel.`, 'Success');
    }
  });
  persist();
}

function syncOTAChannels(propertyId){
  const propsToSync = propertyId === 'all' ? ['azurevista','azuresuite'] : [propertyId];
  let synced = 0;
  propsToSync.forEach(p => {
    OTA_PLATFORMS.forEach(plat => {
      const conn = state.ota[p+'|'+plat];
      if(conn && conn.status === 'connected'){
        conn.lastSync = new Date().toISOString();
        synced++;
        logOTASync(p, plat, '2WAY_SYNC', `Real-time rates & calendar feed synced successfully.`, 'Success');
      }
    });
  });
  state.lastSync = new Date().toISOString();
  persist();
  return synced;
}

function simulateIncomingOTABooking(propertyId, plat){
  const prop = propertyId === 'all' ? 'azurevista' : propertyId;
  const platform = plat || (prop==='azurevista'?'MakeMyTrip':'Airbnb');
  const conn = state.ota[prop+'|'+platform];
  if(conn) {
    conn.status = 'connected';
    conn.lastSync = new Date().toISOString();
  }

  const availableRooms = prop==='azurevista'? state.rooms.filter(r=>r.status==='available') : state.units.filter(u=>u.status==='available');
  const room = availableRooms.length ? availableRooms[0] : (prop==='azurevista'?state.rooms[0]:state.units[0]);
  const newGuestId = uid('GU');
  const newBkId = (platform==='MakeMyTrip'?'MMT-':platform==='Booking.com'?'BDC-':'ABNB-') + Math.floor(1000 + Math.random()*9000);
  const names = ['Vikram Sharma', 'Ananya Deshmukh', 'Rajesh Kulkarni', 'Sarah Jenkins', 'Manish Gupta'];
  const name = names[Math.floor(Math.random()*names.length)];
  const rate = room ? room.rate : 2500;
  const nights = 2;
  const gross = nights * rate;

  state.guests.push({
    id: newGuestId,
    name,
    mobile: '9' + Math.floor(100000000 + Math.random()*900000000),
    email: name.toLowerCase().replace(/\s+/g,'.') + '@example.com',
    address: 'Delhi NCR',
    idType: 'Aadhaar',
    idNumber: 'XXXX-XXXX-' + Math.floor(1000+Math.random()*9000),
    properties: [prop],
    totalStays: 1,
    totalSpend: gross,
    outstanding: 0
  });

  const newBk = {
    id: newBkId,
    property: prop,
    roomId: room ? room.id : 'RM-101',
    guestId: newGuestId,
    guestName: name,
    mobile: '9' + Math.floor(100000000 + Math.random()*900000000),
    email: name.toLowerCase().replace(/\s+/g,'.') + '@example.com',
    adults: 2,
    children: 0,
    checkIn: todayStr(),
    checkInTime: '14:00',
    checkOut: addDays(todayStr(), nights),
    checkOutTime: '11:00',
    rate,
    discount: 0,
    advance: gross,
    source: platform,
    status: 'reserved',
    payment: 'paid',
    notes: `Auto-imported via ${platform} Channel Webhook`,
    createdBy: platform + ' Channel Sync',
    createdDate: todayStr()
  };

  state.bookings.unshift(newBk);
  if(room) room.status = 'reserved';

  logOTASync(prop, platform, 'INCOMING_BOOKING', `Imported Webhook Reservation ${newBkId} for ${name} (${nights} nights, ${roomLabel(room?room.id:'RM-101')})`, 'Success');
  pushAvailabilityToOTAs(prop, room?room.id:'RM-101', 'Imported OTA Booking');

  persist();
  toast(`⚡ Live Webhook: Imported booking ${newBkId} from ${platform}!`);
}

    document.getElementById('s-cancel').onclick = closeModal;
    document.getElementById('s-save').onclick = ()=>{
      const name = document.getElementById('s-name').value.trim(); if(!name){ toast('Enter a name'); return; }
      state.staff.push({id:uid('ST'),name,phone:document.getElementById('s-phone').value,email:document.getElementById('s-email').value,role:document.getElementById('s-role').value,property:document.getElementById('s-property').value,joined:todayStr(),status:'Active'});
      persist(); closeModal(); toast('Staff member added'); render();
    };
  };
}

/* =========================================================
   VIEW: NOTIFICATIONS (full page)
========================================================= */
function viewNotifications(){
  const notifs = computeNotifications();
  return `
  <div class="page-head"><div><h1 class="page-title">Notifications</h1><div class="page-sub">${notifs.length} active alerts · ${propName(ui.property)}</div></div></div>
  <div class="panel"><div class="panel-body flush">
    ${notifs.length? notifs.map(n=>`<div class="notif-item"><div class="t">${esc(n.t)}</div><div class="m">${esc(n.m)}</div></div>`).join('') : `<div class="empty-state"><div class="es-t">All clear</div><div>Nothing needs your attention right now.</div></div>`}
  </div></div>`;
}

/* =========================================================
   VIEW: SETTINGS

  ${isAdmin ? `

    <div class="panel-head" style="background:var(--azure-tint);">

        </div>
        <div class="f-field">
          <label style="font-weight:600;">👔 Manager Password</label>
          <input id="set-pass-manager" type="password" value="${esc(getUserPassword('Manager'))}" placeholder="Manager Password"/>
        </div>
        <div class="f-field">
          <label style="font-weight:600;">🎧 Receptionist Password</label>
          <input id="set-pass-reception" type="password" value="${esc(getUserPassword('Receptionist'))}" placeholder="Receptionist Password"/>
        </div>
      </div>

      <div class="flex" style="justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);flex-wrap:wrap;gap:10px;">
        <label class="flex gap-6" style="font-size:12px;cursor:pointer;">
          <input type="checkbox" id="set-pass-show-toggle"/> Show passwords in plain text
        </label>
        <div class="flex gap-8">
          <button class="btn sm danger" id="set-pass-reset-btn">Reset All Passwords to Default</button>
          <button class="btn primary sm" id="set-pass-save-btn">Update Portal Passwords</button>
        </div>
      </div>
    </div>
  </div>
  ` : `
  <div class="panel" style="border:1px solid var(--line);margin-bottom:20px;background:var(--paper);">
    <div class="panel-body flex" style="gap:12px;">
      <div style="font-size:24px;">🔒</div>
      <div>
        <div style="font-weight:600;font-size:13px;color:var(--ink);">Portal Password Control Restricted</div>
        <div class="text-soft" style="font-size:12px;">Password management for Admin, Manager, and Receptionist portals can only be modified by the <strong>Admin (Owner)</strong> account.</div>
      </div>
    </div>
  </div>
  `}

  <div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Business settings</h3></div><div class="panel-body">
      <div class="form-grid">
        <div class="f-field span2"><label>Business name</label><input id="set-bizname" value="${esc(s.businessName)}"/></div>
        <div class="f-field span2"><label>Owner email</label><input id="set-email" value="${esc(s.ownerEmail)}"/></div>
        <div class="f-field span2"><label>Address</label><input id="set-address" value="${esc(s.address)}"/></div>
      </div>
    </div></div>
    <div class="panel"><div class="panel-head"><h3>Tax settings</h3></div><div class="panel-body">
      <div class="form-grid cols-3">
        <div class="f-field"><label>CGST %</label><input id="set-cgst" type="number" value="${s.tax.cgst}"/></div>
        <div class="f-field"><label>SGST %</label><input id="set-sgst" type="number" value="${s.tax.sgst}"/></div>
        <div class="f-field"><label>IGST %</label><input id="set-igst" type="number" value="${s.tax.igst}"/></div>
      </div>
      <div class="f-hint" style="margin-top:8px;">Tax rates apply to all new invoices and check-out calculations. Nothing is hard-coded.</div>
    </div></div>
  </div>
  <div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Billing</h3></div><div class="panel-body">
      <div class="form-grid">
        <div class="f-field"><label>Invoice prefix</label><input id="set-invprefix" value="${esc(s.invoicePrefix)}"/></div>
        <div class="f-field"><label>Next invoice number</label><input id="set-invseq" type="number" value="${state.invoiceSeq}"/></div>
        <div class="f-field span2"><label>Invoice footer</label><textarea id="set-invfooter">${esc(s.invoiceFooter)}</textarea></div>
        <div class="f-field span2"><label>Terms &amp; conditions</label><textarea id="set-terms">${esc(s.terms)}</textarea></div>
      </div>
    </div></div>
    <div class="panel"><div class="panel-head"><h3>Property settings</h3></div><div class="panel-body">
      ${Object.values(state.properties).map(p=>`
        <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);">
          <strong>${esc(p.name)}</strong>
          <div class="form-grid" style="margin-top:8px;">
            <div class="f-field"><label>Check-in time</label><input data-p-checkin="${p.id}" type="time" value="${p.checkInTime}"/></div>
            <div class="f-field"><label>Check-out time</label><input data-p-checkout="${p.id}" type="time" value="${p.checkOutTime}"/></div>
            <div class="f-field span2"><label>GSTIN</label><input data-p-gstin="${p.id}" value="${esc(p.gstin)}"/></div>
          </div>
        </div>`).join('')}
    </div></div>
  </div>
  <div class="panel"><div class="panel-head" style="display:flex;justify-content:space-between;align-items:center;">
    <h3>Room Settings — Azurevista (Gorakhpur)</h3>
    <button class="btn sm primary" id="set-add-room-vista">+ Add Room</button>
  </div><div class="panel-body flush table-wrap">
    <table><thead><tr><th>Room number</th><th>Type</th><th class="text-right">Rate (₹/night)</th></tr></thead>
    <tbody>${state.rooms.map(r=>`<tr><td><input data-room-number="${r.id}" value="${esc(r.number)}" style="width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;"/></td><td><input data-room-type="${r.id}" value="${esc(r.type)}" style="width:140px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;"/></td><td class="text-right"><input data-room-rate="${r.id}" type="number" value="${r.rate}" style="width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;text-align:right;"/></td></tr>`).join('')}</tbody></table>
  </div></div>

  <div class="panel"><div class="panel-head" style="display:flex;justify-content:space-between;align-items:center;">
    <h3>Unit / Apartment Settings — Azure Suite (Lucknow)</h3>
    <button class="btn sm primary" id="set-add-unit-suite">+ Add Unit</button>
  </div><div class="panel-body flush table-wrap">
    <table><thead><tr><th>Unit name / number</th><th>Type</th><th class="text-right">Rate (₹/night)</th></tr></thead>
    <tbody>${state.units.map(u=>`<tr><td><input data-unit-number="${u.id}" value="${esc(u.number)}" style="width:160px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;"/></td><td><input data-unit-type="${u.id}" value="${esc(u.type)}" style="width:160px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;"/></td><td class="text-right"><input data-unit-rate="${u.id}" type="number" value="${u.rate}" style="width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;text-align:right;"/></td></tr>`).join('')}</tbody></table>
  </div></div>

  <button class="btn primary" id="settings-save">Save all settings</button>
  `;
}
function events_settings(){
  const showToggle = document.getElementById('set-pass-show-toggle');
  if(showToggle){
    showToggle.onchange = ()=>{
      const type = showToggle.checked ? 'text' : 'password';
      ['set-pass-admin','set-pass-manager','set-pass-reception'].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.type = type;
      });
    };
  }

  const passSave = document.getElementById('set-pass-save-btn');
  if(passSave){
    passSave.onclick = ()=>{
      const pAdmin = document.getElementById('set-pass-admin').value.trim();
      const pMgr = document.getElementById('set-pass-manager').value.trim();
      const pRec = document.getElementById('set-pass-reception').value.trim();

      if(!pAdmin || !pMgr || !pRec){
        toast('⚠️ Passwords cannot be empty!');
        return;
      }

      setUserPassword('Admin', pAdmin);
      setUserPassword('Manager', pMgr);
      setUserPassword('Receptionist', pRec);

      logAudit('Settings changed', 'all', 'Admin updated portal passwords');
      persist();
      toast('🔒 Portal passwords updated successfully!');
      render();
    };
  }

  const passReset = document.getElementById('set-pass-reset-btn');
  if(passReset){
    passReset.onclick = ()=>{
      confirmAction('Reset Portal Passwords?', 'This will reset passwords for Admin (admin123), Manager (manager123), and Receptionist (reception123).', ()=>{
        setUserPassword('Admin', 'admin123');
        setUserPassword('Manager', 'manager123');
        setUserPassword('Receptionist', 'reception123');
        logAudit('Settings changed', 'all', 'Admin reset portal passwords to defaults');
        persist();
        closeModal();
        toast('Passwords reset to default values.');
        render();
      });
    };
  }

  const addVista = document.getElementById('set-add-room-vista');
  if(addVista) addVista.onclick = ()=>{
    const nextNum = (100 + state.rooms.length + 1).toString();
    const newRoom = { id: uid('RM'), property: 'azurevista', number: nextNum, type: 'Deluxe', rate: 3200, status: 'available' };
    state.rooms.push(newRoom);
    persist();
    toast(`Room ${nextNum} added to Azurevista`);
    render();
  };

  const addSuite = document.getElementById('set-add-unit-suite');
  if(addSuite) addSuite.onclick = ()=>{
    const nextNum = 'Azure Suite ' + (state.units.length + 1);
    const newUnit = { id: uid('UN'), property: 'azuresuite', number: nextNum, type: '2BHK Apartment', rate: 6500, status: 'available' };
    state.units.push(newUnit);
    persist();
    toast(`${nextNum} added to Azure Suite`);
    render();
  };

  document.getElementById('settings-save').onclick = ()=>{
    const s = state.settings;
    s.businessName = document.getElementById('set-bizname').value;
    s.ownerEmail = document.getElementById('set-email').value;
    s.address = document.getElementById('set-address').value;
    s.tax = { cgst:+document.getElementById('set-cgst').value||0, sgst:+document.getElementById('set-sgst').value||0, igst:+document.getElementById('set-igst').value||0 };
    s.invoicePrefix = document.getElementById('set-invprefix').value;
    state.invoiceSeq = +document.getElementById('set-invseq').value||state.invoiceSeq;
    s.invoiceFooter = document.getElementById('set-invfooter').value;
    s.terms = document.getElementById('set-terms').value;
    document.querySelectorAll('[data-p-checkin]').forEach(el=> state.properties[el.dataset.pCheckin].checkInTime = el.value);
    document.querySelectorAll('[data-p-checkout]').forEach(el=> state.properties[el.dataset.pCheckout].checkOutTime = el.value);
    document.querySelectorAll('[data-p-gstin]').forEach(el=> state.properties[el.dataset.pGstin].gstin = el.value);
    document.querySelectorAll('[data-room-number]').forEach(el=>{ const r = state.rooms.find(x=>x.id===el.dataset.roomNumber); if(r) r.number = el.value; });
    document.querySelectorAll('[data-room-type]').forEach(el=>{ const r = state.rooms.find(x=>x.id===el.dataset.roomType); if(r) r.type = el.value; });
    document.querySelectorAll('[data-room-rate]').forEach(el=>{ const r = state.rooms.find(x=>x.id===el.dataset.roomRate); if(r) r.rate = +el.value||r.rate; });
    document.querySelectorAll('[data-unit-number]').forEach(el=>{ const u = state.units.find(x=>x.id===el.dataset.unitNumber); if(u) u.number = el.value; });
    document.querySelectorAll('[data-unit-type]').forEach(el=>{ const u = state.units.find(x=>x.id===el.dataset.unitType); if(u) u.type = el.value; });
    document.querySelectorAll('[data-unit-rate]').forEach(el=>{ const u = state.units.find(x=>x.id===el.dataset.unitRate); if(u) u.rate = +el.value||u.rate; });
    logAudit('Settings changed', 'all', 'Business/tax/room/unit settings'); persist(); toast('Settings saved'); render();
  };
}

/* =========================================================
   VIEW: GLOBAL SEARCH
========================================================= */
function viewSearch(){
  const q = (ui.searchQuery||'').toLowerCase();
  const bks = state.bookings.filter(b=> (b.id+b.guestName+b.mobile).toLowerCase().includes(q));
  const gs = state.guests.filter(g=> (g.id+g.name+g.mobile+g.email).toLowerCase().includes(q));
  const invs = state.invoices.filter(i=> (i.id+i.guestName).toLowerCase().includes(q));
  const rms = state.rooms.concat(state.units).filter(r=> (r.number+'').toLowerCase().includes(q));
  return `
  <div class="page-head"><div><h1 class="page-title">Search results for "${esc(ui.searchQuery||'')}"</h1></div></div>
  <div class="section-label" style="margin-top:0;">Bookings (${bks.length})</div>
  <div class="panel"><div class="panel-body flush table-wrap"><table><tbody>${bks.length?bks.map(b=>`<tr><td>${b.id}</td><td>${esc(b.guestName)}</td><td>${roomLabel(b.roomId)}</td><td>${statusBadge(b.status)}</td><td><button class="btn sm" data-view-booking="${b.id}">View</button></td></tr>`).join(''):`<tr class="empty-row"><td>No matches.</td></tr>`}</tbody></table></div></div>
  <div class="section-label">Guests (${gs.length})</div>
  <div class="panel"><div class="panel-body flush table-wrap"><table><tbody>${gs.length?gs.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.mobile)}</td><td><button class="btn sm" data-view-guest="${g.id}">View</button></td></tr>`).join(''):`<tr class="empty-row"><td>No matches.</td></tr>`}</tbody></table></div></div>
  <div class="section-label">Invoices (${invs.length})</div>
  <div class="panel"><div class="panel-body flush table-wrap"><table><tbody>${invs.length?invs.map(i=>`<tr><td>${i.id}</td><td>${esc(i.guestName)}</td><td class="text-right">${fmtINR(i.total)}</td><td class="text-right flex gap-4" style="justify-content:flex-end;"><button class="btn sm" data-print-invoice="${i.id}">Print</button><button class="btn sm danger" data-delete-invoice="${i.id}" title="Delete Invoice">🗑️ Delete</button></td></tr>`).join(''):`<tr class="empty-row"><td>No matches.</td></tr>`}</tbody></table></div></div>
  <div class="section-label">Rooms / units (${rms.length})</div>
  <div class="panel"><div class="panel-body flush table-wrap"><table><tbody>${rms.length?rms.map(r=>`<tr><td>${r.property==='azurevista'?'Room '+r.number:r.number}</td><td><span class="tag-prop ${r.property}">${propName(r.property)}</span></td><td>${statusBadge(r.status)}</td></tr>`).join(''):`<tr class="empty-row"><td>No matches.</td></tr>`}</tbody></table></div></div>
  `;
}
function events_search(){
  document.querySelectorAll('[data-view-booking]').forEach(el=> el.onclick = ()=> openBookingDetail(el.dataset.viewBooking));
  document.querySelectorAll('[data-view-guest]').forEach(el=> el.onclick = ()=> openGuestProfile(el.dataset.viewGuest));
  document.querySelectorAll('[data-print-invoice]').forEach(el=> el.onclick = ()=> openInvoicePrint(el.dataset.printInvoice));
  document.querySelectorAll('[data-delete-invoice]').forEach(el=> el.onclick = ()=> deleteInvoice(el.dataset.deleteInvoice));
}

   BOOTSTRAP
========================================================= */
(async function init(){
  await loadInitial();
  render();
  setInterval(updateNetStatus, 4000);
})();

</script>
